<!-- Offline frame renderer for the Alphacell Creatine + Collagen scroll cinematic.
     Loaded headlessly by tools/render-frames.mjs. Not shipped to visitors. -->
<meta charset="utf-8">
<canvas id="c"></canvas>
<script>
'use strict';

/* ---------- deterministic utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeIO=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function css(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}

/* ---------- palette (Alphacell — Nordic Obsidian family, azure signal) ---------- */
const BG_A0=hexRGB('#171A1D'), BG_A1=hexRGB('#14171A');
const BG_B0=hexRGB('#14171A'), BG_B1=hexRGB('#0D1114'), BG_B2=hexRGB('#050606');
const BG_C0=hexRGB('#050606'), BG_C1=hexRGB('#000000');
const CRYSTAL=[221,231,238];         // pale mineral
const CRYSTAL_HI=[248,252,255];
const FIBRE=[242,238,229];           // pearl
const AZURE=[40,146,208];
const WARM=[186,142,92];             // warm mineral
const MORNING=[214,178,128];

/* ---------- vessel silhouette (shared with site copy in js/main.js) ---------- */
const VESSEL={cx:.5,cy:.585,hw:.102,hh:.198,lid:.05}; // tub proportions, normalized

/* ---------- particle fields ---------- */
const NC=240, NF=64, NP=340, NS=260;
const crystals=[],fibres=[],powder=[],swirl=[];
{
  const r=mulberry32(1337);
  for(let i=0;i<NC;i++){
    const verts=[],n=4+((r()*4)|0);
    for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2+r()*.5;const rad=.55+r()*.45;verts.push([Math.cos(a)*rad,Math.sin(a)*rad]);}
    crystals.push({u:r(),v:r(),z:.25+r()*.95,s:2.5+Math.pow(r(),2.2)*17,rot:r()*Math.PI*2,spin:(r()-.5)*.8,ph:r()*Math.PI*2,verts,glint:r()});
  }
  for(let i=0;i<NF;i++){
    fibres.push({u:r(),v:r(),z:.3+r()*.9,ph:r()*Math.PI*2,ph2:r()*Math.PI*2,amp:.5+r(),len:.45+r()*.55,w:.7+r()*1.9,tone:r()});
  }
  for(let i=0;i<NP;i++) powder.push({x:(r()-.5),d:r(),s:.6+r()*1.6,ph:r()*Math.PI*2});
  for(let i=0;i<NS;i++) swirl.push({a:r()*Math.PI*2,rr:.55+r()*.5,vy:(r()-.5),s:.5+r()*1.4,ph:r()*Math.PI*2,z:r()});
}

/* helper: crystal cluster local position (organic cloud, slow inner churn) */
function cloudPos(p,t){
  const a=p.ph+t*.45*p.spin*4;
  const rx=(p.u-.5)*2, ry=(p.v-.5)*2;
  return [rx+Math.cos(a)*.06, ry*.82+Math.sin(a*1.3)*.05];
}

/* ---------- scene ---------- */
let W=1600,H=900,DPR=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

function setSize(w,h){W=w;H=h;cv.width=w;cv.height=h;}

function bgFor(T){ // global T in [0,3]
  if(T<1) return mix(BG_A0,BG_A1,T);
  if(T<1.5) return mix(BG_B0,BG_B1,(T-1)/.5);
  if(T<2) return mix(BG_B1,BG_B2,(T-1.5)/.5);
  return mix(BG_C0,BG_C1,smooth((T-2-.55)/.45));
}

function shaft(x0,y0,x1,y1,c,a,wds){ // volumetric light shaft — fully feathered ellipse
  const len=Math.hypot(x1-x0,y1-y0), ang=Math.atan2(y1-y0,x1-x0);
  ctx.save();
  ctx.translate((x0+x1)/2,(y0+y1)/2);ctx.rotate(ang);ctx.scale(len/2,wds/2);
  const g=ctx.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,css(c,a));g.addColorStop(.6,css(c,a*.45));g.addColorStop(1,css(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawCrystal(p,x,y,scale,alpha,glintT){
  const s=p.s*scale;
  if(s<.4||alpha<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(p.rot+glintT*p.spin);
  ctx.beginPath();
  p.verts.forEach((v,i)=>{i?ctx.lineTo(v[0]*s,v[1]*s):ctx.moveTo(v[0]*s,v[1]*s);});
  ctx.closePath();
  const g=ctx.createLinearGradient(-s,-s,s,s);
  g.addColorStop(0,css(CRYSTAL_HI,alpha));
  g.addColorStop(.55,css(CRYSTAL,alpha*.85));
  g.addColorStop(1,css(mix(CRYSTAL,AZURE,.25),alpha*.5));
  ctx.fillStyle=g;ctx.fill();
  // sharp facet highlight — a glint that travels with phase
  const gl=Math.pow(Math.max(0,Math.sin(glintT*2.2+p.ph)),14);
  if(gl>.05){ctx.strokeStyle=css(CRYSTAL_HI,alpha*gl*.9);ctx.lineWidth=Math.max(.6,s*.08);ctx.beginPath();
    ctx.moveTo(p.verts[0][0]*s,p.verts[0][1]*s);ctx.lineTo(p.verts[1][0]*s,p.verts[1][1]*s);ctx.stroke();}
  ctx.restore();
}

function fibrePath(f,t,cx,cy,spread,weave,S){
  // a long tensile ribbon: base bezier drifting, sinusoidal undulation
  const L=f.len*S*.62;
  const y0=cy+(f.v-.5)*spread;
  const drift=Math.sin(t*.7+f.ph)*S*.02;
  const pts=[];
  const N=22;
  for(let i=0;i<=N;i++){
    const q=i/N;
    const x=cx+(q-.5)*L;
    const und=Math.sin(q*Math.PI*(2+f.amp)+t*1.1+f.ph2)*S*.028*f.amp*(1-weave*.4);
    const wv=weave? Math.sin(q*Math.PI*6+f.ph)*S*.05*weave*Math.sin(t*.6+f.ph2):0;
    pts.push([x,y0+und+wv+drift*Math.sin(q*Math.PI)]);
  }
  return pts;
}
function strokeFibre(f,pts,alpha,scale){
  if(alpha<=0)return;
  ctx.save();
  ctx.shadowColor=css(FIBRE,alpha*.7);ctx.shadowBlur=8*scale;
  ctx.strokeStyle=css(mix(FIBRE,WARM,f.tone*.25),alpha);
  ctx.lineWidth=Math.max(.5,f.w*scale);
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++){const xc=(pts[i][0]+pts[i+1][0])/2,yc=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],xc,yc);}
  ctx.stroke();
  ctx.restore();
}

/* vessel outline points (rounded tub + lid), normalized -> pixels */
function vesselOutline(n){
  const cx=VESSEL.cx*W, cy=VESSEL.cy*H, hw=VESSEL.hw*W, hh=VESSEL.hh*H, lid=VESSEL.lid*H;
  const pts=[];
  // body: rounded rect via parametric walk
  const rr=hw*.28;
  const per=[];
  // build polyline of body rect w/ rounded corners + lid band
  function arc(cx0,cy0,r,a0,a1,steps){for(let i=0;i<=steps;i++){const a=a0+(a1-a0)*i/steps;per.push([cx0+Math.cos(a)*r,cy0+Math.sin(a)*r]);}}
  const top=cy-hh, bot=cy+hh, l=cx-hw, rgt=cx+hw;
  const lidTop=top-lid, lidW=hw*1.06;
  // lid
  per.push([cx-lidW,top]);arc(cx-lidW+rr*.6,lidTop+rr*.6,rr*.6,Math.PI,Math.PI*1.5,4);
  arc(cx+lidW-rr*.6,lidTop+rr*.6,rr*.6,Math.PI*1.5,Math.PI*2,4);per.push([cx+lidW,top]);
  // body right side down
  arc(rgt-rr,bot-rr,rr,0,Math.PI/2,6);
  arc(l+rr,bot-rr,rr,Math.PI/2,Math.PI,6);
  per.push([l,top]);
  // resample to n points
  let total=0;const segs=[];
  for(let i=1;i<per.length;i++){const d=Math.hypot(per[i][0]-per[i-1][0],per[i][1]-per[i-1][1]);segs.push(d);total+=d;}
  const out=[];let target=0,acc=0,si=0;
  for(let k=0;k<n;k++){
    target=total*k/n;
    while(si<segs.length-1&&acc+segs[si]<target){acc+=segs[si];si++;}
    const q=segs[si]?(target-acc)/segs[si]:0;
    out.push([lerp(per[si][0],per[si+1][0],q),lerp(per[si][1],per[si+1][1],q)]);
  }
  return out;
}
function drawVesselSolid(prog,rim){ // prog: 0..1 solidity
  const cx=VESSEL.cx*W, cy=VESSEL.cy*H, hw=VESSEL.hw*W, hh=VESSEL.hh*H, lid=VESSEL.lid*H;
  const rr=hw*.28,top=cy-hh,bot=cy+hh,l=cx-hw,rgt=cx+hw,lidW=hw*1.06,lidTop=top-lid;
  function bodyPath(){
    ctx.beginPath();
    ctx.moveTo(l,top);ctx.lineTo(rgt,top);
    ctx.arcTo(rgt,bot,rgt-rr,bot,rr);ctx.arcTo(l,bot,l,bot-rr,rr);ctx.closePath();
  }
  ctx.save();ctx.globalAlpha=ctx.globalAlpha*prog;
  // body
  bodyPath();
  const g=ctx.createLinearGradient(l,0,rgt,0);
  g.addColorStop(0,'rgba(10,12,14,1)');g.addColorStop(.18,'rgba(26,30,34,1)');
  g.addColorStop(.5,'rgba(17,20,23,1)');g.addColorStop(.86,'rgba(30,34,38,1)');g.addColorStop(1,'rgba(8,10,12,1)');
  ctx.fillStyle=g;ctx.fill();
  // lid
  ctx.beginPath();
  ctx.moveTo(cx-lidW,top);ctx.lineTo(cx-lidW,lidTop+3);ctx.arcTo(cx-lidW,lidTop,cx-lidW+6,lidTop,6);
  ctx.lineTo(cx+lidW-6,lidTop);ctx.arcTo(cx+lidW,lidTop,cx+lidW,lidTop+3,6);ctx.lineTo(cx+lidW,top);ctx.closePath();
  const g2=ctx.createLinearGradient(cx-lidW,0,cx+lidW,0);
  g2.addColorStop(0,'rgba(6,7,8,1)');g2.addColorStop(.2,'rgba(34,38,42,1)');
  g2.addColorStop(.5,'rgba(20,23,26,1)');g2.addColorStop(.85,'rgba(38,42,46,1)');g2.addColorStop(1,'rgba(5,6,7,1)');
  ctx.fillStyle=g2;ctx.fill();
  // label band (matte, slightly lighter) — deliberately blank; the real render carries the label
  ctx.beginPath();ctx.rect(l+hw*.06,top+hh*.42,hw*1.88,hh*1.1);
  ctx.fillStyle='rgba(233,237,234,0.045)';ctx.fill();
  // rim light
  ctx.globalAlpha=ctx.globalAlpha*rim;
  ctx.strokeStyle=css(mix(CRYSTAL,WARM,.35),.5);ctx.lineWidth=1.2;
  bodyPath();ctx.stroke();
  ctx.restore();
}

/* ---------- master frame ---------- */
function renderFrame(T){
  const S=Math.min(W,H*16/9); // scale unit
  ctx.clearRect(0,0,W,H);
  // background
  const bg=bgFor(T);
  ctx.fillStyle=css(bg,1);ctx.fillRect(0,0,W,H);
  // subtle grain-free vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');

  const ch=Math.min(2,Math.floor(T)), t=T-ch;

  if(ch===0) chapterA(t,S);
  else if(ch===1) chapterB(t,S);
  else chapterC(t,S);

  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // global entry fade from black
  if(T<.12){ctx.fillStyle=css([0,0,0],1-smooth(T/.12));ctx.fillRect(0,0,W,H);}
}

/* CHAPTER A — the elements approach one another */
function chapterA(t,S){
  const e=easeIO(t);
  const camX=Math.sin(t*1.2)*S*.012, camY=Math.cos(t*.9)*S*.01;
  // volumetric shafts
  shaft(-W*.05+camX,H*.12,W*.55,H*.62,mix(CRYSTAL,AZURE,.3),.05+.03*Math.sin(t*2),H*.5);
  shaft(W*1.05+camX,H*.2,W*.45,H*.6,FIBRE,.045,H*.55);

  const cCx=lerp(-.16,.40,e)*W+camX, cCy=H*.5+Math.sin(t*2.1)*H*.02+camY;
  const fCx=lerp(1.16,.60,e)*W+camX, fCy=H*.5+Math.cos(t*1.7)*H*.02+camY;
  const spread=H*.62, clusterR=S*.14*(0.8+.3*e);
  const appear=smooth(t/.22);

  // far fibres (blurred layer feel: lower alpha, wider)
  fibres.forEach((f,i)=>{
    if(f.z>.85)return;
    const pts=fibrePath(f,t*3,fCx,fCy,spread*1.15,0,S);
    strokeFibre(f,pts,appear*.10*f.z,f.z*1.9);
  });
  // near fibres
  fibres.forEach((f,i)=>{
    if(f.z<=.85)return;
    const pts=fibrePath(f,t*3,fCx,fCy,spread*.8,0,S);
    strokeFibre(f,pts,appear*.34*(f.z-.4),f.z);
  });

  // crystals: far then near, glints
  const gt=t*3;
  crystals.forEach(p=>{
    const [lx,ly]=cloudPos(p,gt);
    const x=cCx+lx*clusterR*(2.2+p.z), y=cCy+ly*clusterR*(1.7+p.z);
    const a=appear*(p.z<.6?.22:.78)*clamp(p.z,0,1);
    drawCrystal(p,x,y,p.z*(.55+.45*e),a,gt);
  });

  // tiny suspended dust
  const r=mulberry32(77);
  for(let i=0;i<90;i++){
    const dx=r()*W,dy=r()*H,dz=r();
    const tw=.5+.5*Math.sin(gt*1.4+i);
    ctx.fillStyle=css(CRYSTAL,.05+.09*tw*dz*appear);
    ctx.fillRect(dx+Math.sin(gt*.3+i)*8, dy+Math.cos(gt*.23+i)*6, 1.2+dz, 1.2+dz);
  }
}

/* CHAPTER B — formation: weave + convergence to silhouette */
function chapterB(t,S){
  const zoom=1+.12*Math.sin(Math.PI*t); // returns to 1.0 at chapter end for a clean C handoff
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);

  // warm mineral bloom grows
  const warmA=.04+.11*smooth((t-.15)/.6);
  const rg=ctx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,H*.8);
  rg.addColorStop(0,css(WARM,warmA));rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

  const gt=1+t; const anim=gt*3;
  const converge=smooth((t-.72)/.26);          // pull to silhouette
  const weave=smooth((t-.1)/.5);               // interweave amount
  const handoff=smooth(t/.16);                 // blend from chapter A end-state positions
  const outline=vesselOutline(NC);
  const outlineF=vesselOutline(NF*2);

  // light pulses — two travelling rings
  for(let k=0;k<2;k++){
    const pt=(t*1.2+k*.5)%1;
    const rr=pt*H*.9;
    ctx.strokeStyle=css(mix(AZURE,CRYSTAL,.5),.06*(1-pt));
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(W*.5,H*.55,rr,0,Math.PI*2);ctx.stroke();
  }

  // fibres assemble into matrix: weave sinusoids that tighten, then wrap silhouette
  fibres.forEach((f,i)=>{
    const cy=H*(.5+(f.v-.5)*.7*(1-weave*.35));
    const fx=lerp(.60,.5,handoff)*W;
    let pts=fibrePath(f,anim,fx,cy,H*.6*lerp(.8,1,handoff),weave,S);
    if(converge>0){
      const o1=outlineF[(i*2)%outlineF.length], o2=outlineF[(i*2+3)%outlineF.length];
      pts=pts.map((p,j)=>{
        const q=j/(pts.length-1);
        const ox=lerp(o1[0],o2[0],q), oy=lerp(o1[1],o2[1],q);
        return [lerp(p[0],ox,converge),lerp(p[1],oy,converge)];
      });
    }
    strokeFibre(f,pts,(.12+.3*f.z)*(1-converge*.25),f.z*(1-converge*.35));
  });

  // crystal streamlines through centre
  crystals.forEach((p,i)=>{
    const speed=.16+.1*p.z;
    const q=((p.u+t*speed*2.4)%1);
    const sx=q*W;
    const sy=H*(.5+(p.v-.5)*.5)+Math.sin(q*Math.PI*3+p.ph)*H*.07*(1-weave*.5)
             +Math.sin(q*Math.PI*8+p.ph*2)*H*.02*weave;
    let x=sx,y=sy;
    if(handoff<1){ // ease out of chapter A's cluster
      const [lx,ly]=cloudPos(p,3+t*3);
      const clusterR=Math.min(W,H*16/9)*.14*1.1;
      const ax=.40*W+lx*clusterR*(2.2+p.z), ay=H*.5+ly*clusterR*(1.7+p.z);
      x=lerp(ax,sx,handoff);y=lerp(ay,sy,handoff);
    }
    if(converge>0){
      const o=outline[i%outline.length];
      const cstag=clamp(converge*1.35-p.z*.3,0,1);
      x=lerp(sx,o[0],cstag);y=lerp(sy,o[1],cstag);
    }
    const a=(.25+.6*Math.sin(Math.PI*q))*clamp(p.z,0,1);
    drawCrystal(p,x,y,p.z*.85,a,anim);
    // energize: brief azure trace behind fast crystals
    if(p.z>.9&&converge<.4){
      ctx.strokeStyle=css(AZURE,.10*(1-converge));ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(x-14*p.z,y+3);ctx.lineTo(x,y);ctx.stroke();
    }
  });

  // interconnection lines (data-link motif) among a deterministic subset
  const linkA=.05+.1*weave*(1-converge);
  ctx.lineWidth=.7;
  for(let i=0;i<46;i++){
    const p1=crystals[(i*5)%NC], p2=crystals[(i*11+3)%NC];
    const q1=((p1.u+t*(.16+.1*p1.z)*2.4)%1), q2=((p2.u+t*(.16+.1*p2.z)*2.4)%1);
    if(Math.abs(q1-q2)>.14)continue;
    const x1=q1*W, y1=H*(.5+(p1.v-.5)*.5)+Math.sin(q1*Math.PI*3+p1.ph)*H*.07;
    const x2=q2*W, y2=H*(.5+(p2.v-.5)*.5)+Math.sin(q2*Math.PI*3+p2.ph)*H*.07;
    ctx.strokeStyle=css(AZURE,linkA);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.fillStyle=css(AZURE,linkA*1.6);ctx.fillRect(x1-1,y1-1,2,2);
  }

  // silhouette glow emerges
  if(converge>0){
    ctx.strokeStyle=css(mix(CRYSTAL,WARM,.4),.35*converge);
    ctx.lineWidth=1.1;
    ctx.save();ctx.shadowColor=css(FIBRE,.5*converge);ctx.shadowBlur=14;
    const o=vesselOutline(140);
    ctx.beginPath();o.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* CHAPTER C — the ritual: resolve, dissolve, morning */
function chapterC(t,S){
  const gt=2+t, anim=gt*3;
  const solid=smooth(t/.3);                    // vessel solidifies
  const ritual=smooth((t-.34)/.32);            // powder + water current
  const settle=smooth((t-.7)/.3);              // calm, morning light

  // stone surface: soft plane under vessel
  const groundY=(VESSEL.cy+VESSEL.hh)*H+H*.012;
  const gg=ctx.createLinearGradient(0,groundY-H*.02,0,H);
  gg.addColorStop(0,css(mix(BG_C0,WARM,.10),.55*solid));
  gg.addColorStop(.25,css(mix(BG_C0,[20,22,24],.5),.35*solid));
  gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg;ctx.fillRect(0,groundY-H*.02,W,H-groundY+H*.02);

  // residual material absorbing into vessel early on
  if(t<.3){
    const fadeIn=1-smooth(t/.26);
    const outline=vesselOutline(NC);
    crystals.forEach((p,i)=>{
      const o=outline[i%outline.length];
      const pull=smooth(t/.24);
      const x=lerp(o[0],VESSEL.cx*W,pull*.18), y=lerp(o[1],VESSEL.cy*H,pull*.18);
      drawCrystal(p,x,y,p.z*.8*(1-pull*.7),.5*fadeIn*p.z,anim);
    });
    const oF=vesselOutline(NF);
    fibres.forEach((f,i)=>{
      const o=oF[i%NF];
      const pts=[];
      for(let j=0;j<=10;j++){const q=j/10;pts.push([lerp(o[0]-S*.028,o[0]+S*.028,q),o[1]+Math.sin(q*Math.PI*2+anim+f.ph)*3*(1-t/.3)]);}
      strokeFibre(f,pts,.14*fadeIn,f.z*.6);
    });
  }

  // vessel + reflection
  if(solid>0){
    // reflection first (under)
    ctx.save();
    ctx.translate(0,groundY*2);ctx.scale(1,-1);
    ctx.globalAlpha=.10*solid*(1-settle*.4);ctx.filter='blur(3px)';
    drawVesselSolid(1,0);
    ctx.restore();
    drawVesselSolid(solid,.5+.5*Math.sin(t*4)*.2);
  }

  // THE RITUAL — measured scoop of powder falls, circular current dissolves it
  if(ritual>0&&settle<1){
    const rx=W*.715, topY=H*.18, glassY=H*.6;
    const streamA=Math.sin(Math.PI*clamp((t-.34)/.32,0,1)); // rises & fades
    // falling powder column (fine, restrained)
    powder.forEach((p,i)=>{
      const fall=((p.d+t*2.2)%1);
      const y=lerp(topY,glassY,fall);
      const x=rx+p.x*S*.02*(1+fall*2.2)+Math.sin(fall*9+p.ph)*2;
      ctx.fillStyle=css(FIBRE,.5*streamA*(1-fall*.5));
      ctx.fillRect(x,y,p.s,p.s);
    });
    // circular current (implied glass): ellipse swirl
    swirl.forEach((p,i)=>{
      const a=p.a+t*7*(.6+p.z);
      const rr=S*.075*p.rr*(1-ritual*.12);
      const x=rx+Math.cos(a)*rr*1.6;
      const y=glassY+Math.sin(a)*rr*.42+p.vy*S*.02;
      const al=.4*streamA*(0.35+.65*p.z);
      ctx.fillStyle=css(mix(FIBRE,CRYSTAL,p.z),al);
      ctx.fillRect(x,y,p.s,p.s);
    });
    // implied glass rim: single elliptical hairline
    ctx.strokeStyle=css(CRYSTAL,.16*streamA);
    ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(rx,glassY,S*.125,S*.034,0,0,Math.PI*2);ctx.stroke();
  }

  // morning light — quiet warm gradient from low left, grows at the end
  const morn=.05*solid+.32*settle;
  const mg=ctx.createLinearGradient(0,H,W*.4,H*.35);
  mg.addColorStop(0,css(MORNING,morn));mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);
  // and a faint rim from the right for negative-space balance
  const mg2=ctx.createLinearGradient(W,H*.2,W*.55,H*.5);
  mg2.addColorStop(0,css(MORNING,morn*.4));mg2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg2;ctx.fillRect(0,0,W,H);
}

/* API for the driver */
window.__setSize=setSize;
window.__render=(T)=>{renderFrame(T);};
window.__shot=(q)=>cv.toDataURL('image/jpeg',q);
</script>
