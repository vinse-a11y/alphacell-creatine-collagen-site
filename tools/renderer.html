<!-- Offline frame renderer — THE DESCENT.
     The Creatine + Collagen container sinks from a sunlit rippled surface into
     absolute dark. Loaded headlessly by tools/render-frames.mjs; not shipped. -->
<meta charset="utf-8">
<style>
  @font-face{font-family:'Manrope';font-weight:300;src:url('../fonts/manrope-latin-300-normal.woff2') format('woff2');}
  @font-face{font-family:'Manrope';font-weight:500;src:url('../fonts/manrope-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Manrope';font-weight:700;src:url('../fonts/manrope-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:400;src:url('../fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:500;src:url('../fonts/inter-latin-500-normal.woff2') format('woff2');}
  html,body{margin:0;background:#000}
</style>
<canvas id="c"></canvas>
<script>
'use strict';

/* ---------- deterministic helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const inv=(v,a,b)=>clamp((v-a)/(b-a),0,1);
function rgb(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mixc(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function ramp(stops,d){
  for(let i=0;i<stops.length-1;i++){
    const s=stops[i],e=stops[i+1];
    if(d<=e[0]) return mixc(s[1],e[1],inv(d,s[0],e[0]));
  }
  return stops[stops.length-1][1];
}

/* ---------- palette (Alphacell: Baltic Deep, Nordic Obsidian, Azure) ---------- */
const SUNLIT =[ 62,158,182];
const SHALLOW=[ 34,116,148];
const BALTIC =[ 28, 49, 68];
const OBSID  =[ 13, 17, 20];
const BLACK  =[  0,  0,  0];
const AZURE  =[ 40,146,208];
const BONE   =[233,237,234];
const WATER=[[0,SUNLIT],[0.26,SHALLOW],[0.55,BALTIC],[0.80,OBSID],[1,BLACK]];

/* depth 0..1 across the whole piece: chapter A shallow, B does the descent, C the deep */
function depthAt(T){
  if(T<1) return T*0.17;
  if(T<2) return 0.17+(T-1)*0.75;
  return 0.92+(T-2)*0.08;
}

/* ================= THE PRODUCT =================
   Built once into an offscreen bitmap from the supplied packaging photo, then
   only translated / scaled / gently swayed — so the label can never mutate. */
const PW=700, PH=812;
let PRODUCT=null;

function buildProduct(){
  const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;
  const g=cv.getContext('2d');
  const cx=PW/2;
  const bw=470, bl=cx-bw/2, br=cx+bw/2;      // body left / right
  const lidH=96, lidRy=24, lidW=482;
  const lidTopY=lidRy+8;                      // centre of the top ellipse
  const bodyTop=lidTopY+lidH;
  const bodyBot=PH-42;

  /* ---- amber body ---- */
  g.save();
  g.beginPath();
  g.moveTo(bl,bodyTop);
  g.lineTo(bl,bodyBot-46);
  g.quadraticCurveTo(bl,bodyBot,bl+58,bodyBot);
  g.lineTo(br-58,bodyBot);
  g.quadraticCurveTo(br,bodyBot,br,bodyBot-46);
  g.lineTo(br,bodyTop);
  g.closePath();
  const amber=g.createLinearGradient(bl,0,br,0);
  amber.addColorStop(0.00,'#150c07');
  amber.addColorStop(0.10,'#33200f');
  amber.addColorStop(0.26,'#5d3a1c');
  amber.addColorStop(0.37,'#7b4d26');   // soft specular band
  amber.addColorStop(0.52,'#573418');
  amber.addColorStop(0.72,'#3f2612');
  amber.addColorStop(0.88,'#553219');
  amber.addColorStop(1.00,'#130a05');
  g.fillStyle=amber;g.fill();
  // vertical falloff: darker toward the base
  const vf=g.createLinearGradient(0,bodyTop,0,bodyBot);
  vf.addColorStop(0,'rgba(0,0,0,0.30)');
  vf.addColorStop(0.18,'rgba(0,0,0,0)');
  vf.addColorStop(0.80,'rgba(0,0,0,0)');
  vf.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=vf;g.fill();
  g.restore();

  /* ---- label (white, wraps the middle) ---- */
  const jarTop=lidTopY-lidRy, jarH=bodyBot-jarTop;
  const labT=jarTop+jarH*0.275, labB=jarTop+jarH*0.825;
  const labH=labB-labT;
  g.save();
  g.beginPath();g.rect(bl,labT,bw,labH);g.clip();
  g.fillStyle='#f7f9fa';g.fillRect(bl,labT,bw,labH);

  // light blue lower band with a soft curved top edge
  const bandTop=labT+labH*0.685;
  g.beginPath();
  g.moveTo(bl,bandTop+12);
  g.bezierCurveTo(bl+bw*0.32,bandTop-14,bl+bw*0.64,bandTop+8,br,bandTop-10);
  g.lineTo(br,labB);g.lineTo(bl,labB);g.closePath();
  const band=g.createLinearGradient(0,bandTop-16,0,labB);
  band.addColorStop(0,'#93c6e8');band.addColorStop(1,'#79b6e0');
  g.fillStyle=band;g.fill();

  // dot cluster upper-right (the packaging's bio-link motif)
  [[0.075,0.03,6],[0.115,0.075,3.5],[0.16,0.015,4.5],[0.205,0.065,7],
   [0.265,0.025,3],[0.315,0.07,5],[0.40,0.04,3.5],[0.47,0.075,6],
   [0.55,0.03,3],[0.63,0.06,4.5]].forEach(function(d){
    g.beginPath();g.arc(br-bw*0.055-d[1]*bw,labT+labH*d[0],d[2],0,Math.PI*2);
    g.fillStyle=d[0]<0.66?'rgba(46,134,200,0.9)':'rgba(255,255,255,0.92)';g.fill();
  });

  /* ---- label typography (Manrope is the packaging face) ---- */
  const tx=cx-bw*0.012;   // optical centre of the panel facing us
  g.textAlign='center';

  // ALPHACELL / LABS
  g.font='700 31px Manrope';
  const a1='ALPHA', a2='CELL';
  const w1=g.measureText(a1).width, w2=g.measureText(a2).width;
  g.textAlign='left';
  const ax=tx-(w1+w2)/2;
  g.fillStyle='#16314f';g.fillText(a1,ax,labT+labH*0.155);
  g.fillStyle='#2e86c8';g.fillText(a2,ax+w1,labT+labH*0.155);
  g.font='500 11px Manrope';g.fillStyle='#16314f';
  g.fillText('TM',ax+w1+w2+2,labT+labH*0.125);
  g.textAlign='center';
  drawTracked(g,'LABS',tx,labT+labH*0.215,5,'500 12px Manrope','#16314f');

  // DOCTOR FORMULATED
  drawTracked(g,'DOCTOR FORMULATED',tx,labT+labH*0.315,1.4,'700 18px Manrope','#2e86c8');

  // CREATINE + / COLLAGEN
  g.fillStyle='#11151a';
  g.font='700 41px Manrope';
  g.fillText('CREATINE +',tx,labT+labH*0.445);
  g.fillText('COLLAGEN',tx,labT+labH*0.555);

  // POWDER UNFLAVORED
  g.font='700 20px Manrope';
  const p1='POWDER ', p2='UNFLAVORED';
  const pw1=g.measureText(p1).width, pw2=g.measureText(p2).width;
  g.textAlign='left';
  const px=tx-(pw1+pw2)/2;
  g.fillStyle='#11151a';g.fillText(p1,px,labT+labH*0.635);
  g.fillStyle='#2e86c8';g.fillText(p2,px+pw1,labT+labH*0.635);
  g.textAlign='center';

  // the three package icons on the blue band
  const iy=labT+labH*0.775, ir=19;
  drawIcon(g,tx-ir*2.45,iy,ir,'pulse');
  drawIcon(g,tx        ,iy,ir,'brain');
  drawIcon(g,tx+ir*2.45,iy,ir,'dna');

  // legal lines
  g.textAlign='left';
  g.font='500 12px Inter';g.fillStyle='#11151a';
  g.fillText('Dietary Supplement',tx-bw*0.30,labT+labH*0.905);
  g.font='400 16px Inter';
  g.fillText('Net Wt. 10.58oz (300g)',tx-bw*0.30,labT+labH*0.962);
  g.textAlign='center';

  // wrapped side panel copy on the far left + code block on the right edge
  g.fillStyle='rgba(17,21,26,0.26)';
  for(let i=0;i<11;i++) g.fillRect(bl+7,labT+labH*0.10+i*11,22,3);
  g.fillStyle='rgba(17,21,26,0.5)';
  const qs=3, qr=mulberry32(99);
  for(let i=0;i<7;i++)for(let j=0;j<7;j++) if(qr()>0.45) g.fillRect(br-24+i*qs,labT+labH*0.50+j*qs,qs,qs);

  // cylinder shading over the whole label — kept light so the label reads white
  const lg=g.createLinearGradient(bl,0,br,0);
  lg.addColorStop(0.00,'rgba(0,0,0,0.42)');
  lg.addColorStop(0.09,'rgba(0,0,0,0.13)');
  lg.addColorStop(0.24,'rgba(255,255,255,0.06)');
  lg.addColorStop(0.50,'rgba(0,0,0,0.01)');
  lg.addColorStop(0.80,'rgba(0,0,0,0.14)');
  lg.addColorStop(1.00,'rgba(0,0,0,0.48)');
  g.fillStyle=lg;g.fillRect(bl,labT,bw,labH);
  g.restore();

  // label edges
  g.strokeStyle='rgba(0,0,0,0.22)';g.lineWidth=1.2;
  g.beginPath();g.moveTo(bl,labT);g.lineTo(br,labT);g.moveTo(bl,labB);g.lineTo(br,labB);g.stroke();

  /* ---- black lid ---- */
  g.save();
  g.beginPath();
  g.moveTo(cx-lidW/2,lidTopY);
  g.lineTo(cx-lidW/2,lidTopY+lidH-10);
  g.quadraticCurveTo(cx-lidW/2,lidTopY+lidH,cx-lidW/2+14,lidTopY+lidH);
  g.lineTo(cx+lidW/2-14,lidTopY+lidH);
  g.quadraticCurveTo(cx+lidW/2,lidTopY+lidH,cx+lidW/2,lidTopY+lidH-10);
  g.lineTo(cx+lidW/2,lidTopY);
  g.closePath();
  const lidG=g.createLinearGradient(cx-lidW/2,0,cx+lidW/2,0);
  lidG.addColorStop(0.00,'#030405');
  lidG.addColorStop(0.11,'#14181b');
  lidG.addColorStop(0.31,'#2b3136');
  lidG.addColorStop(0.50,'#161a1d');
  lidG.addColorStop(0.76,'#242a2f');
  lidG.addColorStop(1.00,'#020303');
  g.fillStyle=lidG;g.fill();
  // fine knurling
  g.globalAlpha=0.22;
  for(let x=cx-lidW/2+5;x<cx+lidW/2-4;x+=6){
    g.strokeStyle='rgba(0,0,0,0.9)';g.lineWidth=1.6;
    g.beginPath();g.moveTo(x,lidTopY+6);g.lineTo(x,lidTopY+lidH-5);g.stroke();
  }
  g.globalAlpha=1;
  g.restore();

  // white lid top (seen slightly from above)
  g.beginPath();g.ellipse(cx,lidTopY,lidW/2-6,lidRy,0,0,Math.PI*2);
  const topG=g.createLinearGradient(cx-lidW/2,lidTopY-lidRy,cx+lidW/2,lidTopY+lidRy);
  topG.addColorStop(0,'#b7bdc0');topG.addColorStop(0.42,'#f2f4f5');topG.addColorStop(1,'#a6acaf');
  g.fillStyle=topG;g.fill();
  g.strokeStyle='rgba(0,0,0,0.4)';g.lineWidth=2;g.stroke();

  PRODUCT={canvas:cv,w:PW,h:PH,cx:cx,
    labelTop:labT,labelBot:labB,labelL:bl,labelR:br,
    bodyTop:bodyTop,bodyBot:bodyBot};
}

function drawTracked(g,text,cx,y,track,font,fill){
  g.font=font;g.fillStyle=fill;
  let total=0;
  for(const ch of text) total+=g.measureText(ch).width+track;
  total-=track;
  let x=cx-total/2;
  g.textAlign='left';
  for(const ch of text){g.fillText(ch,x,y);x+=g.measureText(ch).width+track;}
  g.textAlign='center';
}

function drawIcon(g,x,y,r,kind){
  g.save();
  g.beginPath();g.arc(x,y,r,0,Math.PI*2);
  g.fillStyle='#2e86c8';g.fill();
  g.strokeStyle='#ffffff';g.lineWidth=2.4;g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  if(kind==='pulse'){
    // heart with a pulse line
    const s=r*0.055;
    g.moveTo(x-9*s*1.6,y-1*s*1.6);
    g.bezierCurveTo(x-9*s*1.6,y-8*s*1.6,x,y-8*s*1.6,x,y-2*s*1.6);
    g.bezierCurveTo(x,y-8*s*1.6,x+9*s*1.6,y-8*s*1.6,x+9*s*1.6,y-1*s*1.6);
    g.bezierCurveTo(x+9*s*1.6,y+5*s*1.6,x,y+10*s*1.6,x,y+10*s*1.6);
    g.bezierCurveTo(x,y+10*s*1.6,x-9*s*1.6,y+5*s*1.6,x-9*s*1.6,y-1*s*1.6);
    g.stroke();
    g.beginPath();
    g.moveTo(x-r*0.55,y+r*0.05);g.lineTo(x-r*0.2,y+r*0.05);
    g.lineTo(x-r*0.05,y-r*0.22);g.lineTo(x+r*0.12,y+r*0.28);
    g.lineTo(x+r*0.28,y+r*0.05);g.lineTo(x+r*0.55,y+r*0.05);
    g.lineWidth=2.2;g.stroke();
  }else if(kind==='brain'){
    g.ellipse(x-r*0.16,y,r*0.42,r*0.52,0,0,Math.PI*2);
    g.ellipse(x+r*0.20,y,r*0.36,r*0.48,0,0,Math.PI*2);
    g.stroke();
    g.beginPath();
    g.moveTo(x-r*0.02,y-r*0.5);g.lineTo(x-r*0.02,y+r*0.5);
    g.moveTo(x-r*0.35,y-r*0.14);g.lineTo(x-r*0.02,y-r*0.02);
    g.moveTo(x+r*0.34,y-r*0.2);g.lineTo(x+r*0.02,y+r*0.1);
    g.lineWidth=1.9;g.stroke();
  }else{
    // DNA double helix
    for(let k=0;k<2;k++){
      g.beginPath();
      for(let i=0;i<=22;i++){
        const q=i/22, yy=y-r*0.62+q*r*1.24;
        const xx=x+Math.sin(q*Math.PI*2+k*Math.PI)*r*0.36;
        i?g.lineTo(xx,yy):g.moveTo(xx,yy);
      }
      g.stroke();
    }
    g.lineWidth=1.7;
    for(let i=1;i<5;i++){
      const q=i/5, yy=y-r*0.62+q*r*1.24;
      g.beginPath();
      g.moveTo(x+Math.sin(q*Math.PI*2)*r*0.36,yy);
      g.lineTo(x+Math.sin(q*Math.PI*2+Math.PI)*r*0.36,yy);
      g.stroke();
    }
  }
  g.restore();
}

/* ================= particle systems ================= */
const NB=150, NS=420, NSILT=220;
const bubbles=[], snow=[], silt=[];
{
  const r=mulberry32(20260730);
  for(let i=0;i<NB;i++)   bubbles.push({u:r(),v:r(),z:0.25+r()*1.0,ph:r()*Math.PI*2,sp:0.5+r(),wob:0.4+r()*1.4});
  for(let i=0;i<NS;i++)   snow.push({u:r(),v:r(),z:0.15+r()*1.0,ph:r()*Math.PI*2,sp:0.3+r()*0.9,sz:0.5+r()*1.7});
  for(let i=0;i<NSILT;i++)silt.push({u:r(),v:r(),z:r(),ph:r()*Math.PI*2,sz:0.4+r()*1.5,sp:0.2+r()*0.8});
}

/* ================= scene ================= */
let W=1600,H=900;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
function setSize(w,h){W=w;H=h;cv.width=w;cv.height=h;}

/* soft elongated light shaft via a scaled radial gradient (feathered on all sides) */
function shaft(x,y,len,wid,ang,col,a){
  if(a<=0.002) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.translate(x,y);ctx.rotate(ang);ctx.scale(wid,len);
  const g=ctx.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,rgb(col,a));
  g.addColorStop(0.45,rgb(col,a*0.42));
  g.addColorStop(1,rgb(col,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* the rippled surface, seen from below — echoes the product photograph */
function drawSurface(T,d,sy,bright){
  if(bright<=0.004||sy<-H*0.5) return;
  const sunX=W*0.60;
  // water-to-air brightness above the plane
  const g=ctx.createLinearGradient(0,sy-H*0.42,0,sy+H*0.10);
  g.addColorStop(0,rgb(mixc(SUNLIT,[255,255,255],0.55),0.85*bright));
  g.addColorStop(0.55,rgb(mixc(SUNLIT,[255,255,255],0.22),0.42*bright));
  g.addColorStop(1,rgb(SUNLIT,0));
  ctx.fillStyle=g;ctx.fillRect(0,sy-H*0.42,W,H*0.52);

  // sun bloom
  ctx.save();ctx.globalCompositeOperation='lighter';
  const sg=ctx.createRadialGradient(sunX,sy-H*0.10,0,sunX,sy-H*0.10,H*0.46);
  sg.addColorStop(0,'rgba(255,255,255,'+(0.50*bright)+')');
  sg.addColorStop(0.35,rgb(mixc(SUNLIT,[255,255,255],0.6),0.20*bright));
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  ctx.restore();

  // concentric ripple rings on the underside of the surface
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.translate(sunX,sy);
  ctx.scale(1,0.16);
  const t=T*3;
  for(let i=0;i<16;i++){
    const phase=(i/16+t*0.11)%1;
    const rr=phase*W*0.95;
    const a=(1-phase)*0.11*bright*(0.5+0.5*Math.sin(phase*Math.PI*6+t));
    if(a<=0.002) continue;
    ctx.strokeStyle=rgb(mixc(SUNLIT,[255,255,255],0.7),a);
    ctx.lineWidth=(3+phase*22)/0.16*0.16;
    ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

/* god rays wheeling down from the surface */
function drawRays(T,d,sy,strength){
  if(strength<=0.004) return;
  const t=T*3;
  const src=W*0.60;
  const col=mixc(SUNLIT,[255,255,255],0.62);
  const r=mulberry32(7);
  for(let i=0;i<11;i++){
    const base=(r()-0.5)*1.5;                      // stable per-ray angle
    const ang=Math.PI/2+base*0.42+Math.sin(t*0.16+i)*0.05;
    const len=H*(0.72+r()*0.62);
    const wid=W*(0.012+r()*0.030);
    const a=strength*(0.05+r()*0.085)*(0.72+0.28*Math.sin(t*0.5+i*1.7));
    shaft(src+base*W*0.30, sy+len*0.42, len, wid, ang-Math.PI/2, col, a);
  }
}

/* near-surface caustic shimmer */
function drawCaustics(T,strength){
  if(strength<=0.004) return;
  const t=T*3;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const col=mixc(SUNLIT,[255,255,255],0.75);
  for(let i=0;i<16;i++){
    const x=(0.5+0.48*Math.sin(t*0.23+i*2.1))*W;
    const y=(0.12+0.5*Math.abs(Math.sin(t*0.17+i*1.3)))*H;
    const rr=H*(0.05+0.09*Math.abs(Math.sin(i*0.7)));
    const a=strength*0.035*(0.5+0.5*Math.sin(t*0.9+i));
    const g=ctx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0,rgb(col,a));g.addColorStop(1,rgb(col,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* bubbles rising past the camera */
function drawBubbles(T,d,burst){
  const t=T*3;
  const fade=1-inv(d,0.55,0.92);
  if(fade<=0.01&&burst<=0.01) return;
  ctx.save();
  bubbles.forEach(function(b,i){
    const speed=(0.10+b.sp*0.16);
    const q=((b.v + t*speed + (burst>0? 0:0))%1);
    const y=(1-q)*H*1.25-H*0.1;
    const x=b.u*W + Math.sin(q*Math.PI*4*b.wob+b.ph)*W*0.018;
    const rr=(0.9+b.z*3.4)*(1+burst*1.1);
    let a=(0.10+0.20*b.z)*fade + burst*0.30*b.z;
    if(a<=0.004) return;
    a*=(0.35+0.65*Math.sin(Math.PI*clamp(q*1.1,0,1)));
    ctx.strokeStyle=rgb(mixc(SUNLIT,[255,255,255],0.8),a);
    ctx.lineWidth=Math.max(0.6,rr*0.28);
    ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.stroke();
    // rim highlight
    ctx.fillStyle=rgb([255,255,255],a*0.55);
    ctx.beginPath();ctx.arc(x-rr*0.32,y-rr*0.34,Math.max(0.4,rr*0.24),0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}

/* marine snow — drifts upward as we sink, layered for depth of field */
function drawSnow(T,d,rate){
  const t=T*3;
  const col=mixc([255,255,255],SUNLIT,0.25);
  snow.forEach(function(p){
    const q=((p.v + t*(0.045+p.sp*0.085)*rate)%1);
    const y=(1-q)*H*1.2-H*0.08;
    const x=p.u*W + Math.sin(q*Math.PI*3+p.ph)*W*0.01;
    const sz=p.sz*(0.5+p.z*1.5);
    const a=(0.05+0.16*p.z)*(1-d*0.35);
    if(a<=0.004) return;
    ctx.fillStyle=rgb(col,a);
    ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();
  });
}

/* ---------- the product, graded on its own stage so nothing spills ----------
   Light absorption and the key beam are composited with source-atop INSIDE an
   offscreen stage, where everything outside the container is transparent. */
const STAGE=document.createElement('canvas');
let sctx=null;
function drawProduct(x,y,scale,rot,light,blurTrail,glow){
  const p=PRODUCT;
  if(STAGE.width!==p.w){STAGE.width=p.w;STAGE.height=p.h;sctx=STAGE.getContext('2d');}
  sctx.globalCompositeOperation='source-over';
  sctx.clearRect(0,0,p.w,p.h);
  sctx.drawImage(p.canvas,0,0);

  // water absorbs light with depth — clipped to the container's own pixels
  sctx.globalCompositeOperation='source-atop';
  sctx.fillStyle=rgb(BLACK,clamp(1-light,0,0.94));
  sctx.fillRect(0,0,p.w,p.h);

  // a narrowing key beam keeps the label readable as everything else goes dark
  if(glow>0.01){
    const lt=p.labelTop/p.h, lb=p.labelBot/p.h;
    const g=sctx.createLinearGradient(0,0,0,p.h);
    // the cap is the surface facing the light — it must never read as open
    g.addColorStop(0,rgb(BONE,0.30*glow));
    g.addColorStop(0.10,rgb(BONE,0.24*glow));
    g.addColorStop(0.16,rgb(mixc(BONE,AZURE,0.2),0.11*glow));
    g.addColorStop(Math.max(0.17,lt-0.09),rgb(mixc(BONE,AZURE,0.3),0.09*glow));
    g.addColorStop(lt+0.012,rgb(BONE,0.42*glow));
    g.addColorStop((lt+lb)/2,rgb(BONE,0.46*glow));
    g.addColorStop(lb-0.012,rgb(mixc(BONE,AZURE,0.45),0.26*glow));
    g.addColorStop(Math.min(0.998,lb+0.09),rgb(mixc(BONE,AZURE,0.5),0.07*glow));
    g.addColorStop(1,rgb(AZURE,0.02*glow));
    sctx.fillStyle=g;sctx.fillRect(0,0,p.w,p.h);
    // the beam pools toward the centre of the panel rather than lighting it evenly
    const midY=p.h*(lt+lb)/2;
    const rg=sctx.createRadialGradient(p.w*0.47,midY,p.w*0.10,p.w*0.47,midY,p.w*0.72);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(0.55,rgb(BLACK,0.08*glow));
    rg.addColorStop(1,rgb(BLACK,0.5*glow));
    sctx.fillStyle=rg;
    // confined to the label band, so the cap and base keep their own lighting
    sctx.fillRect(0,p.labelTop-14,p.w,(p.labelBot-p.labelTop)+28);
  }
  sctx.globalCompositeOperation='source-over';

  const w=p.w*scale, h=p.h*scale;
  function paint(alpha,dy){
    ctx.save();
    ctx.translate(x,y+(dy||0));ctx.rotate(rot);
    ctx.globalAlpha=alpha;
    ctx.drawImage(STAGE,-w/2,-h/2,w,h);
    ctx.restore();
  }
  // vertical motion smear — it is sinking
  if(blurTrail>0.01){
    for(let k=3;k>=1;k--) paint(0.085*blurTrail/k, -h*0.013*k*blurTrail);
  }
  paint(1,0);

  // soft bloom shed by the lit label
  if(glow>0.02){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.filter='blur('+Math.round(26*scale+14)+'px)';
    ctx.globalAlpha=0.20*glow;
    ctx.translate(x,y);ctx.rotate(rot);
    const sy0=(p.labelTop/p.h-0.5)*h, sy1=(p.labelBot/p.h-0.5)*h;
    ctx.drawImage(STAGE,0,p.labelTop,p.w,p.labelBot-p.labelTop,-w/2,sy0,w,sy1-sy0);
    ctx.filter='none';
    ctx.restore();
  }
}

/* fog / water haze in front of the subject */
function drawFog(d,amount,col){
  if(amount<=0.004) return;
  const g=ctx.createRadialGradient(W*0.5,H*0.5,H*0.12,W*0.5,H*0.5,H*0.95);
  g.addColorStop(0,rgb(col,amount*0.28));
  g.addColorStop(1,rgb(col,amount*0.72));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function vignette(strength){
  const g=ctx.createRadialGradient(W/2,H*0.48,H*0.26,W/2,H*0.5,H*1.02);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ================= master frame ================= */
function renderFrame(T){
  T=clamp(T,0,2.9999);
  const d=depthAt(T);
  const water=ramp(WATER,d);

  ctx.clearRect(0,0,W,H);
  // base water column: lighter above, darker below
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,rgb(mixc(water,[255,255,255],0.10*(1-d)),1));
  bg.addColorStop(0.55,rgb(water,1));
  bg.addColorStop(1,rgb(mixc(water,BLACK,0.45),1));
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  const surfBright=Math.pow(1-inv(d,0.02,0.42),1.4);
  const surfY=lerp(H*0.30,-H*0.55,inv(d,0,0.40));
  const rayS=Math.pow(1-inv(d,0.05,0.52),1.3);

  drawSurface(T,d,surfY,surfBright);
  drawRays(T,d,surfY,rayS);
  drawCaustics(T,surfBright*0.9);
  drawSnow(T,d,T<1?0.7:1.15);

  /* ---- product staging per chapter ---- */
  let px,py,scale,rot,light,trail,glow;
  const t=T-Math.floor(Math.min(T,2));
  if(T<1){
    // THE DROP — breaks the surface, bubble bloom, begins to sink
    const e=smooth(inv(T,0.08,1.0));
    px=W*(0.52-0.02*e);
    py=lerp(surfY+H*0.03,H*0.50,e);
    scale=lerp(0.46,0.60,e);
    rot=Math.sin(T*2.1)*0.05-0.04;
    light=1-d*0.5;
    trail=smooth(inv(T,0.12,0.5))*(1-smooth(inv(T,0.6,1)))*0.9;
    glow=0;
  }else if(T<2){
    // THE DESCENT — camera tracks, water darkens, key light narrows
    px=W*0.50+Math.sin((T-1)*3.4)*W*0.016;
    py=H*(0.50+Math.sin((T-1)*2.2)*0.012);
    scale=lerp(0.60,0.70,t);
    rot=Math.sin((T-1)*2.6+0.5)*0.075;
    light=clamp(1-d*1.02,0.14,1);
    trail=0.45+0.3*Math.sin(t*Math.PI);
    glow=smooth(inv(d,0.45,0.86));
  }else{
    // THE DEEP — macro in the dark, silt drifting through the beam
    const e=smooth(t);
    px=W*lerp(0.50,0.415,e);
    py=H*lerp(0.50,0.53,e);
    scale=lerp(0.70,1.42,e);
    rot=lerp(0.05,0.012,e)*Math.cos(t*1.6);
    light=clamp(0.16+0.10*e,0,1);
    trail=0.20*(1-e);
    glow=1;
  }

  const burst=T<0.55? Math.pow(1-inv(T,0.10,0.55),1.6)*smooth(inv(T,0.08,0.18)) : 0;
  drawBubbles(T,d,burst);
  drawProduct(px,py,scale,rot,light,trail,glow);

  // silt through the beam in the deep
  if(T>=1.7){
    const s=inv(T,1.7,2.15), tt=T*3;
    ctx.save();ctx.globalCompositeOperation='lighter';
    silt.forEach(function(p){
      const q=((p.v+tt*(0.03+p.sp*0.05))%1);
      const y=(1-q)*H*1.15-H*0.06;
      const x=p.u*W+Math.sin(q*Math.PI*2+p.ph)*W*0.02;
      // only silt near the beam catches light
      const beam=Math.pow(clamp(1-Math.abs(x-px)/(W*0.20),0,1),1.6);
      const a=s*beam*(0.06+0.16*p.z);
      if(a<=0.004) return;
      ctx.fillStyle=rgb(mixc(BONE,AZURE,0.25),a);
      ctx.beginPath();ctx.arc(x,y,p.sz*(0.6+p.z),0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }

  drawFog(d,0.30+0.45*d,mixc(water,BLACK,0.35));
  vignette(0.42+0.34*d);

  // opening fade from black
  if(T<0.10) ctx.fillStyle=rgb(BLACK,1-smooth(T/0.10)),ctx.fillRect(0,0,W,H);
}

/* ---------- driver API ---------- */
window.__ready=(async function(){
  await Promise.all([
    document.fonts.load('700 56px Manrope'),
    document.fonts.load('500 17px Manrope'),
    document.fonts.load('300 40px Manrope'),
    document.fonts.load('400 21px Inter'),
    document.fonts.load('500 17px Inter')
  ]);
  await document.fonts.ready;
  buildProduct();
  return true;
})();
window.__setSize=setSize;
window.__render=function(T){renderFrame(T);};
window.__shot=function(q){return cv.toDataURL('image/jpeg',q);};
window.__product=function(){return PRODUCT.canvas.toDataURL('image/jpeg',0.92);};
</script>
